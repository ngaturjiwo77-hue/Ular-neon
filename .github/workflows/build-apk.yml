name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Rakit Lingkungan Expo yang Sehat
        run: |
          npx create-expo-app@latest build-env --yes
          
          # Buat folder secara paksa agar tidak error saat disalin
          mkdir -p build-env/app build-env/src
          rm -rf build-env/app/*
          
          # Salin semua isi kode game Anda dari Termux ke lingkungan baru
          cp -a app/. build-env/app/
          cp -a src/. build-env/src/
          
          cd build-env
          npx expo install @react-native-async-storage/async-storage
          
          # Atur nama APK secara otomatis
          jq '.expo.name = "Ular Neon" | .expo.slug = "ular-neon" | .expo.android.package = "com.ularneon.game"' app.json > temp.json && mv temp.json app.json

      - name: Generate Android Native Folder
        run: |
          cd build-env
          npx expo prebuild --platform android --clean

      - name: Build APK (Debug Version)
        run: |
          cd build-env/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UlarNeon-Debug-APK
          path: build-env/android/app/build/outputs/apk/debug/app-debug.apk
